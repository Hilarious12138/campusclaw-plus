name: verify
on:
  push:
    branches-ignore: [main]
  pull_request:
  schedule:
    - cron: '0 1 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global @fission-ai/openspec@1.13.0
      - run: make check
      - run: make audit
