name: verify
on:
  push:
    branches-ignore: [main]
  pull_request:
  schedule:
    - cron: '0 1 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global @fission-ai/openspec@1.13.0
      - run: make check

  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare isolated test configuration
        run: |
          docker run --rm -v "$PWD/scripts/test-env.mjs:/test-env.mjs:ro" node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1 node /test-env.mjs > .env
      - name: Docker-only acceptance
        run: sh scripts/grade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-report
          path: reports/acceptance-*/
          retention-days: 7
