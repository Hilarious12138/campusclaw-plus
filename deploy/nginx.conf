map $http_x_request_id $correlation_id {
    default $request_id;
    "~^[A-Za-z0-9_-]{1,64}$" $http_x_request_id;
}
log_format structured escape=json '{"time":"$time_iso8601","level":"INFO","module":"nginx","event":"request","request_id":"$correlation_id","method":"$request_method","path":"$uri","status":$status,"duration_seconds":$request_time}';
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log /dev/stdout structured;
    error_log /dev/stderr warn;
    location = /health { proxy_pass http://api:8080; proxy_set_header X-Request-ID $correlation_id; }
    location = /live { proxy_pass http://api:8080; proxy_set_header X-Request-ID $correlation_id; }
    location /api/ { proxy_pass http://api:8080; proxy_set_header X-Request-ID $correlation_id; }
    location /uploads/ { return 404; }
    location = / { try_files /index.html =404; }
    location / { try_files $uri =404; }
}
