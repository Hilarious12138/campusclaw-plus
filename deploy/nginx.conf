map $http_x_request_id $correlation_id {
    default $request_id;
    "~^[A-Za-z0-9_-]{1,64}$" $http_x_request_id;
}
log_format structured escape=json '{"time":"$time_iso8601","level":"INFO","module":"nginx","event":"request","request_id":"$correlation_id","method":"$request_method","path":"$uri","status":$status,"duration_seconds":$request_time}';
server {
    listen 80;
    client_max_body_size 3m;
    server_name _;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream api:8080;
    root /usr/share/nginx/html;
    access_log /dev/stdout structured;
    error_log /dev/stderr warn;
    location = /health { proxy_pass http://$api_upstream$request_uri; proxy_set_header X-Request-ID $correlation_id; }
    location = /live { proxy_pass http://$api_upstream$request_uri; proxy_set_header X-Request-ID $correlation_id; }
    location /api/ { proxy_pass http://$api_upstream$request_uri; proxy_set_header X-Request-ID $correlation_id; }
    location /uploads/ { return 404; }
    location = /swagger { return 301 /swagger/; }
    location = /swagger/ { try_files /swagger/index.html =404; }
    location = / { try_files /index.html =404; }
    location / { try_files $uri =404; }
}
