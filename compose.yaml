name: campusclaw-plus
services:
  db:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    environment:
      MYSQL_DATABASE: ${DB_NAME:?fill DB_NAME}
      MYSQL_USER: ${DB_USER:?fill DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?fill DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?fill DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped
  api:
    build: {context: ., dockerfile: deploy/api.Dockerfile}
    environment:
      APP_ENV: ${APP_ENV:?fill APP_ENV}
      APP_VERSION: ${APP_VERSION:?fill APP_VERSION}
      HTTP_ADDR: ${HTTP_ADDR:?fill HTTP_ADDR}
      DB_ADDR: ${DB_ADDR:?fill DB_ADDR}
      DB_NAME: ${DB_NAME:?fill DB_NAME}
      DB_USER: ${DB_USER:?fill DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?fill DB_PASSWORD}
      DB_TIMEOUT_MS: ${DB_TIMEOUT_MS:?fill DB_TIMEOUT_MS}
      SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS:?fill SHUTDOWN_TIMEOUT_SECONDS}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, /usr/local/bin/campusclaw-plus, healthcheck]
      interval: 3s
      timeout: 4s
      retries: 10
    stop_grace_period: 12s
    restart: unless-stopped
  web:
    build: {context: ., dockerfile: deploy/web.Dockerfile}
    ports: ['127.0.0.1:${WEB_PORT:?fill WEB_PORT}:80']
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1/health >/dev/null']
      interval: 3s
      timeout: 4s
      retries: 10
    restart: unless-stopped
volumes:
  mysql-data:
